name: App branch build validation

on:
  push:
    branches:
      - tanshu-apk-android-app
  pull_request:
    branches:
      - tanshu-apk-android-app

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build
