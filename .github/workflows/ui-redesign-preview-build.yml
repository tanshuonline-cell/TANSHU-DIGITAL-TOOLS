name: UI redesign preview build

on:
  push:
    branches:
      - tanshu-ui-redesign-preview
  pull_request:
    branches:
      - tanshu-ui-redesign-preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build visual preview
        run: npm run build
